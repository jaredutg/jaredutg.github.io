<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>长辈服用表</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#13201c;--ink2:#48574f;--line:#d9d2c3;--accent:#1f5c4a;--warn:#a2381f}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2220;--ink:#e9f0ed;--ink2:#b0bdb7;--line:#33403b;--accent:#7cc4ad;--warn:#f08f72}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
 font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB','Noto Sans SC',sans-serif}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 22px}
h1{font-size:26px;margin:0 0 6px}
p{margin:0 0 18px;color:var(--ink2);font-size:17px;line-height:1.5}
label.k{display:block;font-size:17px;margin-bottom:8px}
input[type=password],input[type=text]{width:100%;font-size:22px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);letter-spacing:1px}
.row{display:flex;align-items:center;gap:10px;margin:14px 0 18px;font-size:17px;color:var(--ink2)}
.row input{width:22px;height:22px;accent-color:var(--accent)}
button{width:100%;font-size:20px;font-weight:700;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--card);cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:24px;margin-top:12px;font-size:16px}
.msg.err{color:var(--warn)}
footer{padding:16px;text-align:center;font-size:13px;color:var(--ink2)}
footer a{color:inherit;text-decoration:none}
</style>
</head>
<body>
<main>
<form class="card" id="f" autocomplete="on">
 <h1>长辈服用表</h1>
 <p>家里人专用。请点继钧发的完整链接打开；链接不全的话，把钥匙填在下面。</p>
 <label class="k" for="pw">钥匙</label>
 <input id="pw" name="key" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
 <label class="row"><input type="checkbox" id="rm" checked> 记住这台手机，下次不用再输</label>
 <button id="go" type="submit">打开</button>
 <div class="msg" id="msg" role="status" aria-live="polite"></div>
</form>
</main>
<footer><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">苏ICP备2026059001号</a></footer>

var $=function(id){return document.getElementById(id)};
function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function b64(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function show(html){
  // swap the page in place (no document.write: phones keep the viewport and scale correctly)
  var doc=new DOMParser().parseFromString(html,"text/html");
  document.title=doc.title||document.title;
  Array.prototype.forEach.call(doc.documentElement.attributes,function(a){document.documentElement.setAttribute(a.name,a.value)});
  Array.prototype.slice.call(document.head.querySelectorAll("style")).forEach(function(n){n.remove()});
  Array.prototype.forEach.call(doc.head.querySelectorAll("style"),function(n){document.head.appendChild(document.importNode(n,true))});
  var vp=doc.head.querySelector('meta[name="viewport"]'),mine=document.head.querySelector('meta[name="viewport"]');
  if(vp&&mine)mine.setAttribute("content",vp.getAttribute("content"));
  var body=document.importNode(doc.body,true);
  var scripts=Array.prototype.slice.call(body.querySelectorAll("script"));
  scripts.forEach(function(n){n.remove()});
  document.body.replaceWith(body);
  scripts.forEach(function(old){var n=document.createElement("script");Array.prototype.forEach.call(old.attributes,function(a){n.setAttribute(a.name,a.value)});n.textContent=old.textContent;document.body.appendChild(n)});
  window.scrollTo(0,0);
}
function msg(t,err){var m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"")}
if(!(window.crypto&&crypto.subtle)){msg("这个浏览器打不开。请用手机自带的浏览器或微信打开。",true);$("go").disabled=true;return}
function openWithKey(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c)).then(function(buf){return new TextDecoder().decode(buf)})}
function keyFromPw(pw){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])})}
function tryPw(pw,remember){
  $("go").disabled=true;msg("正在打开，请稍等几秒……");
  var k;
  return keyFromPw(pw).then(function(key){k=key;return openWithKey(key)}).then(function(html){
    if(remember){crypto.subtle.exportKey("raw",k).then(function(raw){try{localStorage.setItem("fsbk",b64(new Uint8Array(raw)))}catch(e){}}).then(function(){show(html)})}
    else{show(html)}
  }).catch(function(){$("go").disabled=false;msg("钥匙不对。请重新点继钧发的完整链接。",true)})}
// 1) this phone already remembers the key
var saved=null;try{saved=localStorage.getItem("fsbk")}catch(e){}
if(saved){
  crypto.subtle.importKey("raw",u8(saved),{name:"AES-GCM"},false,["decrypt"]).then(openWithKey).then(show)
    .catch(function(){try{localStorage.removeItem("fsbk")}catch(e){}});
}
// 2) key in the link (#k=...), never sent to the server
var h=location.hash;
if(!saved&&h.indexOf("#k=")===0){
  var pw=decodeURIComponent(h.slice(3));
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  tryPw(pw,true);
}
$("f").addEventListener("submit",function(e){e.preventDefault();var v=$("pw").value.trim();if(v)tryPw(v,$("rm").checked)});
})();
