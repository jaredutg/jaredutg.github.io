/* ---------- 顶部一行提示 + 页尾长说明 ---------- */
.k-notice{font-size:12px;color:var(--ink3);margin:-14px 0 22px;line-height:1.7}

.k-tail .disc,.k-tail .warn,.k-tail .note,.k-tail .ten{font-size:12.2px}

/* ---------- 顶部导航 ---------- */
.k-nav{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 92%,transparent);

 border-bottom:1px solid var(--line);margin:0 0 0}
.k-navin{max-width:1400px;margin:0 auto;padding:7px 20px;display:flex;align-items:center;gap:10px;

.k-tog:hover{color:var(--ink);border-color:var(--line2)}

/* ---------- 左侧粘性目录 ---------- */
.k-toc{position:fixed;left:max(10px,calc(50% - var(--kw)/2 - 178px));top:96px;width:164px;z-index:40;
 font-size:12px;line-height:1.45;max-height:calc(100vh - 130px);overflow-y:auto;
 padding-right:6px;scrollbar-width:thin}

 border-left:2px solid transparent;transition:.12s}
.k-toc a:hover{color:var(--ink);background:var(--panel)}
.k-toc a.on{color:var(--ink);border-left-color:var(--accent);font-weight:600;background:var(--panel)}
.k-tocm{display:none}
/* 侧栏目录只在「正文两侧真的放得下」时才出现，由 JS 量出来打 html.k-wide */
.k-toc{display:none}
html.k-wide .k-toc{display:block}
.k-tocm{display:block;position:sticky;top:38px;z-index:50;padding:6px 0 4px;background:var(--bg)}
html.k-wide .k-tocm{display:none}
.k-tocm select{font:inherit;font-size:12.5px;width:100%;max-width:420px;padding:5px 8px;border-radius:7px;
 border:1px solid var(--line);background:var(--panel);color:var(--ink)}

/* ---------- 可排序表头 ---------- */
th.k-s{cursor:pointer;user-select:none;position:relative;white-space:nowrap}
th.k-s:hover{color:var(--ink)}
th.k-s::after{content:"↕";opacity:.28;font-size:9px;margin-left:3px;vertical-align:1px}
th.k-s.k-asc::after{content:"↑";opacity:.95}
th.k-s.k-desc::after{content:"↓";opacity:.95}
thead th{position:sticky;top:36px;background:var(--bg);z-index:5}
/* .k-tw 是横向滚动容器，浏览器会把它也当成纵向滚动容器：
   此时 top:36px 会把表头往下推 36px，正好盖住第一行。容器内一律贴 0。 */
.k-tw thead th{top:0}

/* ---------- 宽表格容器 ---------- */
.k-tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.k-tw>table{min-width:max-content}
@media(max-width:520px){.k-tw>table{min-width:0}}

/* ---------- 图表外壳 ---------- */
.k-fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px 10px;margin:14px 0 18px}
.k-fig h4{margin:0 0 2px;font-size:14px}
.k-fig .k-cap{margin:0 0 10px;font-size:12px;color:var(--ink3);line-height:1.55}
.k-figbody{overflow-x:auto;-webkit-overflow-scrolling:touch}
.k-figbody svg{display:block;max-width:100%;height:auto}
.k-lg{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;color:var(--ink2);margin-top:9px;align-items:center}
.k-lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.k-lg .sq{border-radius:2px}
.k-tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;z-index:200;max-width:290px;

.k-tip b{color:var(--ink)}
.k-tip .k-tk{color:var(--ink3);font-size:11px}
.k-dot{cursor:pointer;transition:opacity .12s}
.k-dot:hover{opacity:.82}
.k-hl{animation:k-flash 1.7s ease-out 1}
@keyframes k-flash{0%,22%{box-shadow:0 0 0 3px color-mix(in srgb,var(--dv3) 62%,transparent)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- 条形着色单元格 ---------- */
.k-bc{position:relative;z-index:0}
.k-bc::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:var(--w,0%);

/* ---------- 打印 ---------- */
@media print{
 :root{--bg:#fff;--panel:#fff}

 .k-fig,.seg,.card,.etf{page-break-inside:avoid}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>

  h+=next?A(next,next[0]+' '+next[1]+' →'):'<a style="opacity:.32;pointer-events:none">下一篇 →</a>';

  setTheme(getTheme());
}

/* ---------- 粘性目录（由 h2 生成） ---------- */
function toc(scope){

    document.documentElement.classList.toggle('k-wide',window.innerWidth>=wpx+372);

/* ---------- 表头排序 ---------- */
function sortable(tableSel,cfg,rows,render,opt){
  var tb=document.querySelector(tableSel);if(!tb)return;
  var table=tb.closest('table'),ths=[].slice.call(table.querySelectorAll('thead th'));
  var st={k:(opt&&opt.k)||null,dir:(opt&&opt.dir)||1},base=rows.slice();
  var filt=(opt&&opt.filter)||function(r){return r;};
  ths.forEach(function(th,i){
    var key=cfg[i];if(!key)return;
    th.classList.add('k-s');th.tabIndex=0;
    function go(){st.dir=st.k===key?-st.dir:(key.desc?-1:1);st.k=key;paint();}
    th.onclick=go;th.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};
  });
  function paint(){
    var r=filt(base.slice());
    if(st.k){var f=st.k.get;
      r.sort(function(a,b){var va=f(a),vb=f(b);
        if(va==null&&vb==null)return 0; if(va==null)return 1; if(vb==null)return -1;
        var c=typeof va==='number'?va-vb:String(va).localeCompare(String(vb),'zh');
        return c*st.dir;});}
    ths.forEach(function(th,i){var key=cfg[i];if(!key)return;
      th.classList.toggle('k-asc',st.k===key&&st.dir===1);
      th.classList.toggle('k-desc',st.k===key&&st.dir===-1);});
    render(r);
  }
  paint();
  return {refresh:paint,setFilter:function(fn){filt=fn;paint();}};
}

/* ---------- 宽表格自己横向滚动，不让整页横向滚 ---------- */
function wrapTables(scope){
  var root=document.querySelector(scope||'.wrap');if(!root)return;
  [].slice.call(root.querySelectorAll('table')).forEach(function(t){
    if(t.parentElement&&t.parentElement.classList.contains('k-tw'))return;
    var p=t.parentElement,ok=false;
    while(p&&p!==root){var ox=getComputedStyle(p).overflowX;if(ox==='auto'||ox==='scroll'){ok=true;break;}p=p.parentElement;}
    if(ok)return;
    var w=document.createElement('div');w.className='k-tw';
    t.parentNode.insertBefore(w,t);w.appendChild(t);
  });
}

/* ---------- 提示气泡 ---------- */
var TIP=null;
function tip(){if(!TIP){TIP=el('div',{'class':'k-tip'});document.body.appendChild(TIP);}return TIP;}
function tipOn(e,html){var t=tip();t.innerHTML=html;t.style.opacity=1;tipMove(e);}
function tipMove(e){var t=tip();var x=e.clientX+14,y=e.clientY+14;
  var b=t.getBoundingClientRect();
  if(x+b.width>innerWidth-8)x=e.clientX-b.width-14;
  if(y+b.height>innerHeight-8)y=Math.max(8,e.clientY-b.height-14);
  t.style.left=x+'px';t.style.top=y+'px';}
function tipOff(){if(TIP)TIP.style.opacity=0;}
function bindTip(node,html){
  node.addEventListener('mouseenter',function(e){tipOn(e,html);});
  node.addEventListener('mousemove',tipMove);
  node.addEventListener('mouseleave',tipOff);
}

/* ---------- 标签避让：候选位打分，取重叠最小的一个 ---------- */
function placeLabels(items,W,H,fs,seeds){
  var placed=(seeds||[]).slice();
  var cand=[[1,0,'start',.35],[-1,0,'end',.35],[0,-1,'middle',-.55],[0,1,'middle',1.15],
            [1,-1,'start',-.25],[-1,-1,'end',-.25],[1,1,'start',1.0],[-1,1,'end',1.0],
            [1.9,0,'start',.35],[-1.9,0,'end',.35],[0,-1.9,'middle',-.55],[0,1.9,'middle',1.15]];
  function ov(a,b){var w=Math.min(a.x1,b.x1)-Math.max(a.x0,b.x0),h=Math.min(a.y1,b.y1)-Math.max(a.y0,b.y0);
    return (w>0&&h>0)?w*h:0;}
  items.forEach(function(it){
    var w=tw(it.text,fs),h=fs*1.15,best=null,bestScore=Infinity;
    for(var ci=0;ci<cand.length;ci++){
      var c=cand[ci],pad=it.r+5;
      var cx=it.x+c[0]*pad, cy=it.y+c[1]*pad+c[3]*fs;
      var x0=c[2]==='start'?cx:c[2]==='end'?cx-w:cx-w/2;
      var box={x0:x0-1.5,y0:cy-h*.82,x1:x0+w+1.5,y1:cy+h*.24};
      var pen=0;
      if(box.x0<2)pen+=(2-box.x0)*80; if(box.x1>W-2)pen+=(box.x1-(W-2))*80;
      if(box.y0<2)pen+=(2-box.y0)*80; if(box.y1>H-2)pen+=(box.y1-(H-2))*80;
      for(var p=0;p<placed.length;p++) pen+=ov(box,placed[p])*(placed[p].soft?0.55:1);
      pen+=ci*0.6; /* 同分时优先靠前的候选位 */
      if(pen<bestScore){bestScore=pen;best={x:cx,y:cy,anchor:c[2],box:box};}
      if(pen<=ci*0.6+0.01)break;
    }
    placed.push(best.box);
    it.lx=best.x;it.ly=best.y;it.anchor=best.anchor;it.show=true;it.clean=bestScore<8;
  });
  return items;
}

/* ---------- 散点 / 气泡图 ---------- */
function scatter(host,o){
  var W=o.w||940,H=o.h||460,PL=o.pl||58,PR=o.pr||22,PT=o.pt||18,PB=o.pb||46;
  var pts=o.pts,fs=o.fs||10.5;
  var xs=pts.map(function(p){return o.xLog?Math.log(Math.max(p.x,1e-6))/Math.LN10:p.x;});
  var ys=pts.map(function(p){return o.yLog?Math.log(Math.max(p.y,1e-6))/Math.LN10:p.y;});
  var x0=o.x0!=null?(o.xLog?Math.log(o.x0)/Math.LN10:o.x0):Math.min.apply(null,xs)-.4;
  var x1=o.x1!=null?(o.xLog?Math.log(o.x1)/Math.LN10:o.x1):Math.max.apply(null,xs)+.4;
  var y0=o.y0!=null?(o.yLog?Math.log(o.y0)/Math.LN10:o.y0):Math.min.apply(null,ys)-.3;
  var y1=o.y1!=null?(o.yLog?Math.log(o.y1)/Math.LN10:o.y1):Math.max.apply(null,ys)+.3;

  var Y=function(v){var t=o.yLog?Math.log(Math.max(v,1e-6))/Math.LN10:v;return H-PB-(t-y0)/(y1-y0)*(H-PT-PB);};
  var svg=S('svg',{viewBox:'0 0 '+W+' '+H,width:W,height:H,role:'img','aria-label':o.alt||o.title||'散点图'});

    g.appendChild(S('text',{x:x,y:H-PB+15,'text-anchor':'middle','font-size':10.5,fill:'var(--ink3)'},t.t));});
  (o.yTicks||[]).forEach(function(t){var y=Y(t.v);

    g.appendChild(S('text',{x:PL-7,y:y+3.5,'text-anchor':'end','font-size':10.5,fill:'var(--ink3)'},t.t));});
  g.appendChild(S('line',{x1:PL,y1:H-PB,x2:W-PR,y2:H-PB,stroke:'var(--dvaxis)'}));
  g.appendChild(S('line',{x1:PL,y1:PT,x2:PL,y2:H-PB,stroke:'var(--dvaxis)'}));
  if(o.xLabel)g.appendChild(S('text',{x:(PL+W-PR)/2,y:H-8,'text-anchor':'middle','font-size':11,fill:'var(--dvlab)'},o.xLabel));
  if(o.yLabel)g.appendChild(S('text',{x:14,y:(PT+H-PB)/2,'text-anchor':'middle','font-size':11,fill:'var(--dvlab)',
    transform:'rotate(-90 14 '+((PT+H-PB)/2)+')'},o.yLabel));
  var seeds=[];
  (o.quads||[]).forEach(function(q){
    var qx=q.px!=null?q.px:X(q.x), qy=q.py!=null?q.py:Y(q.y), qfs=q.fs||11, an=q.anchor||'middle';

/* ---------- 分层依赖图（自上而下 9 层） ---------- */
function dag(host,o){
  var layers=o.layers, edges=o.edges;

    var n=l.nodes.length, span=n*(NW+GX)-GX;
    var startX=PLft+((W-PLft-30)-span)/2;
    l.nodes.forEach(function(nd,ni){
      pos[nd.id]={x:startX+ni*(NW+GX),y:34+li*LY,li:li,ni:ni,node:nd};
      byId[nd.id]=nd;

  var down={},up={};

    svg.appendChild(S('text',{x:8,y:y+26,'font-size':9.5,fill:'var(--ink3)','fill-opacity':.72},l.tier));
  });
  var gEdge=S('g',{'stroke-linecap':'round',fill:'none'});svg.appendChild(gEdge);
  var gNode=S('g');svg.appendChild(gNode);
  var epath={};
  edges.forEach(function(e){
    var a=pos[e[0]],b=pos[e[1]];if(!a||!b)return;
    var x1=a.x+NW/2,y1=a.y+NH,x2=b.x+NW/2,y2=b.y;

    var p=S('path',{d:'M'+x1+' '+y1+'C'+x1+' '+(y1+dy)+','+x2+' '+(y2-dy)+','+x2+' '+y2,
      stroke:'var(--dvaxis)','stroke-width':1,'stroke-opacity':.3});

  });
  var boxes={};
  layers.forEach(function(l){l.nodes.forEach(function(nd){
    var p=pos[nd.id];
    var g=S('g',{'class':'k-dot',transform:'translate('+p.x+','+p.y+')'});
    var rect=S('rect',{width:NW,height:NH,rx:7,fill:nd.bg,stroke:nd.color,'stroke-width':1.2});
    g.appendChild(rect);
    var name=nd.label, fs=11;
    while(tw(name,fs)>NW-12&&fs>8.6)fs-=.5;
    if(tw(name,fs)>NW-12){var cut=name;while(tw(cut+'…',fs)>NW-12&&cut.length>2)cut=cut.slice(0,-1);name=cut+'…';}
    g.appendChild(S('text',{x:NW/2,y:15,'text-anchor':'middle','font-size':fs,'font-weight':620,fill:nd.color},name));
    var kpi=nd.kpi||'';var kfs=8.8;
    if(tw(kpi,kfs)>NW-10){var c2=kpi;while(tw(c2+'…',kfs)>NW-10&&c2.length>2)c2=c2.slice(0,-1);kpi=c2+'…';}
    g.appendChild(S('text',{x:NW/2,y:27,'text-anchor':'middle','font-size':kfs,fill:'var(--ink3)'},kpi));
    if(nd.tip)bindTip(g,nd.tip);
    g.addEventListener('click',function(){o.onClick&&o.onClick(nd);focus(nd.id);});
    gNode.appendChild(g);boxes[nd.id]={g:g,rect:rect,nd:nd};
  });});
  var cur=null, dimFn=null;
  function walk(id,map,acc){ (map[id]||[]).forEach(function(x){ if(!acc[x]){acc[x]=1;walk(x,map,acc);} }); return acc; }
  function focus(id){
    if(cur===id){cur=null;paint(null);return;} cur=id;paint(id);
  }
  function base(k){return dimFn?(dimFn(boxes[k].nd)?1:0.14):1;}
  function paint(id){
    if(!id){
      Object.keys(boxes).forEach(function(k){boxes[k].g.style.opacity=base(k);boxes[k].rect.setAttribute('stroke-width',1.2);});
      Object.keys(epath).forEach(function(k){epath[k].setAttribute('stroke','var(--dvaxis)');
        epath[k].setAttribute('stroke-opacity',.3);epath[k].setAttribute('stroke-width',1);});
      o.onFocus&&o.onFocus(null);return;
    }
    var d=walk(id,down,{}),u=walk(id,up,{});
    Object.keys(boxes).forEach(function(k){
      var on=(k===id)||d[k]||u[k];
      boxes[k].g.style.opacity=on?base(k):Math.min(base(k),.16);
      boxes[k].rect.setAttribute('stroke-width',k===id?2.6:1.2);
    });
    Object.keys(epath).forEach(function(k){
      var ab=k.split('>'),a=ab[0],b=ab[1];
      var onD=(a===id||d[a])&&(d[b]||b===id||false);
      var onU=(b===id||u[b])&&(u[a]||a===id||false);
      var on=onD||onU;
      epath[k].setAttribute('stroke',on?(onD?'var(--dv6)':'var(--dv1)'):'var(--dvaxis)');
      epath[k].setAttribute('stroke-opacity',on?.72:.07);
      epath[k].setAttribute('stroke-width',on?1.7:1);
    });
    o.onFocus&&o.onFocus({id:id,down:Object.keys(d),up:Object.keys(u)});
  }
  host.innerHTML='';host.appendChild(svg);
  return {focus:focus,clear:function(){cur=null;paint(null);},pos:pos,boxes:boxes,
    setDim:function(fn){dimFn=fn;paint(cur);},
    downstream:function(id){return Object.keys(walk(id,down,{}));},
    upstream:function(id){return Object.keys(walk(id,up,{}));}};
}

   cols.map(function(c){return '<th class="'+(c.num?'num':(c.cls==='long'?'longc':''))+'">'+esc(c.t)+'</th>';}).join('')+
   '</tr></thead><tbody id="tb"></tbody></table></div>';
  K.wrapTables('.wrap');
  document.getElementById('expand').style.display='';
  sorter=K.sortable('#tb',cols.map(function(c){return {get:c.get,desc:c.num?1:0};}),cur.rows(),render);
  paint();
}
function render(rows){
  var cols=cur.cols;
  document.getElementById('tb').innerHTML=rows.map(function(r){
    return '<tr>'+cols.map(function(c){
      var v=c.cell(r);
      if(c.cls==='long'){ /* 表格单元格里不能用 line-clamp（Chromium 会把行高算错），直接截字 */
        var t=txt(v), sh=(t.length>96?t.slice(0,96)+'…':t);
        v='<span title="'+esc(t)+'">'+esc(full?t:sh)+'</span>'; }
      return '<td class="'+(c.num?'num':(c.cls||''))+'">'+v+'</td>';}).join('')+'</tr>';
  }).join('');
  document.getElementById('cnt').textContent='显示 '+rows.length+' / '+cur.rows().length+' 行';
  document.getElementById('empty').style.display=rows.length?'none':'block';
}
function paint(){
  if(!sorter||cur.doc)return;
  sorter.setFilter(function(rows){ if(!q)return rows;
    var k=q.toLowerCase();
    return rows.filter(function(r){return hay(r,cur.cols).toLowerCase().indexOf(k)>=0;});});
}
